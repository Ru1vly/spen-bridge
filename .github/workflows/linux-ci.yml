name: Linux CI

on:
  push:
    paths:
      - 'server/**'
      - 'tests/**'
      - '*.sh'
      - 'server/*.sh'
      - '*.desktop'
      - '.github/workflows/linux-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'tests/**'
      - '*.sh'
      - 'server/*.sh'
      - '*.desktop'
      - '.github/workflows/linux-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n start.sh
          bash -n server/setup_uinput.sh

      - name: Validate desktop entry files
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils python3-gi gir1.2-glib-2.0 libegl1 libopengl0
          desktop-file-validate spen-bridge.desktop

      - name: Check permission helper in an isolated container
        if: matrix.python-version == '3.14'
        run: |
          docker build -t spen-permission-test -f tests/permission_container/Containerfile tests/permission_container
          docker run --rm --network=none --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD/server/setup_uinput.sh,dst=/work/setup_uinput.sh,readonly" \
            --mount "type=bind,src=$PWD/tests/permission_container/test.sh,dst=/work/test.sh,readonly" \
            spen-permission-test bash /work/test.sh

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r tests/requirements.txt

      - name: Lint Python
        run: ruff check --isolated --select E9,F server tests audit/reproduce.py

      - name: Run test suite (headless Qt)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export PYTHONPATH=.
          pytest -v

      - name: Audit locked runtime dependencies
        if: matrix.python-version == '3.14'
        run: pip-audit -r server/requirements.txt --disable-pip --no-deps
