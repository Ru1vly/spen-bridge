name: Windows Driver Build

on:
  push:
    paths:
      - 'windows/driver/spenvhid/**'
      - 'server/**'
      - 'tests/**'
      - '*.ps1'
      - 'windows/*.ps1'
      - '.github/workflows/windows-driver-build.yml'
  pull_request:
    paths:
      - 'windows/driver/spenvhid/**'
      - 'server/**'
      - 'tests/**'
      - '*.ps1'
      - 'windows/*.ps1'
  workflow_dispatch: {}

jobs:
  build:
    # Pinned, not "windows-latest": the WDK NuGet version <-> required VS
    # version <-> runner image version chain is demonstrably fast-moving
    # (see README.md) - a floating alias would make a currently-green
    # workflow silently break on GitHub's next runner rotation.
    runs-on: windows-2025
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet CLI
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Restore WDK/SDK NuGet packages
        # `dotnet restore` explicitly does not work with the WDK NuGet
        # package per Microsoft's own docs - must use nuget.exe against the
        # project-local packages.config, not the .sln.
        run: nuget restore windows\driver\spenvhid\packages.config -PackagesDirectory windows\driver\spenvhid\packages

      - name: Build spenvhid driver
        run: msbuild windows\driver\spenvhid\spenvhid.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /m /warnaserror

      - name: Assemble unsigned driver package
        shell: pwsh
        run: |
          $inf2cat = Get-ChildItem windows/driver/spenvhid/packages -Recurse -Filter Inf2Cat.exe | Select-Object -First 1
          if (-not $inf2cat) { throw 'WDK Inf2Cat.exe not found' }
          .\windows\package-driver.ps1 `
            -BuildRoot "windows/driver/spenvhid/x64/${{ matrix.configuration }}" `
            -OutputDirectory "windows/driver/package/${{ matrix.configuration }}" `
            -Inf2CatPath $inf2cat.FullName

      - name: Verify stamped INF
        run: |
          $tool = Get-ChildItem windows/driver/spenvhid/packages -Recurse -Filter infverif.exe | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $tool) { throw 'WDK infverif.exe not found' }
          $inf = Get-ChildItem 'windows/driver/spenvhid/x64/${{ matrix.configuration }}' -Recurse -Filter spenvhid.inf | Select-Object -First 1
          if (-not $inf) { throw 'Stamped driver INF not found' }
          & $tool.FullName /w $inf.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Windows application and report contract
        run: |
          python -m pip install -r server/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v

      - name: Parse PowerShell entry points
        run: |
          $scripts = @('install.ps1', 'start.ps1', 'windows/install-driver.ps1', 'windows/package-driver.ps1', 'windows/validate-driver.ps1')
          foreach ($script in $scripts) {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }

      - name: Upload built driver
        uses: actions/upload-artifact@v4
        with:
          name: spenvhid-driver-${{ matrix.configuration }}
          path: |
            windows/driver/spenvhid/x64/${{ matrix.configuration }}/**/spenvhid.sys
            windows/driver/spenvhid/x64/${{ matrix.configuration }}/**/spenvhid.inf
            windows/driver/spenvhid/x64/${{ matrix.configuration }}/**/*.pdb
            windows/driver/spenvhid/x64/${{ matrix.configuration }}/**/*.cat
            windows/driver/package/${{ matrix.configuration }}/*
          if-no-files-found: error
