name: Android CI
on:
  push:
    paths: ['android/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle Wrapper JAR
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Audit locked Android runtime and toolchain
        run: python3 audit/scan_android.py
      - name: Verify, test, build and lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --dependency-verification strict --no-daemon --max-workers=2
      - name: Record artifact source commit
        run: git rev-parse HEAD > android/app/build/outputs/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build-and-reports
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/app/build/outputs/source-commit.txt
          if-no-files-found: error
